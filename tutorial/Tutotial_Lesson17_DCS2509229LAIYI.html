<!DOCTYPE html>
<html><head><title>Lesson 17</title>
<link rel=icon href=JujutsuKaisen.png type=image/png>
<meta name=viewport content=width=device-width, initial-scale=1.0>
<link rel="stylesheet" href="Tutorial17style.css">
</head>
<body>

<div class=number>
<h2>Simple JavaScript Calculator</h2>

Enter first number:
<input type="number" id="num1" required><br><br>

Enter second number:
<input type="number" id="num2" required><br><br>

<button class="add" onclick="calculate('+')">Add</button>

<button class="subtract" onclick="calculate('-')">Subtract</button>

<button class="mutiply" onclick="calculate('*')">Multiply</button>

<button class="divide" onclick="calculate('/')">Divide</button>

<h2 id="result">Result: </h2>

<script>
    function calculate(operator) {
      let n1 = parseFloat(document.getElementById("num1").value);
      let n2 = parseFloat(document.getElementById("num2").value);
      let result;

      if (isNaN(n1) || isNaN(n2)) {
        result = "Please enter both numbers";
      } else {
        switch (operator) { 
          case '+':
            result = n1+n2;
            break;
          case '-':
            result = n1-n2;
            break;
          case '*':
            result = n1*n2;
            break;
          case '/':
            result = n1/n2;
            break;
        }
      }

      document.getElementById("result").innerHTML ="Result:" + result;

    }
</script>
</div>
</body></html>
